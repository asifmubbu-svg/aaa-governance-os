# Render Blueprint - one-click infrastructure for Governance OS.
# In Render: New > Blueprint, connect this repo, and it reads this file.
services:
  - type: web
    name: aaa-governance-os
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection string (Supabase Session pooler / Neon) - set in dashboard.
      - key: DATABASE_URL
        sync: false
      # JWT secret - Render generates a strong random value automatically.
      - key: GOV_SECRET
        generateValue: true
      # Seeded demo-account password - set your own in the dashboard.
      - key: GOV_DEFAULT_PASSWORD
        sync: false
      # AI assistant (Groq). Free key from console.groq.com. Optional - the app
      # runs in grounded search mode without it.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
